<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回測查詢報表 2026-08-05</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
  background: #F4F6F9; color: #222; padding: 16px; line-height: 1.5;
}
.wrap { max-width: 1100px; margin: 0 auto; }
header h1 { margin: 0 0 4px; color: #1F3A5F; font-size: 22px; }
header .meta { color: #666; font-size: 13px; margin-bottom: 16px; }
.panel { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 14px; margin-bottom: 14px; }
.filters .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.filters label { display: flex; flex-direction: column; font-size: 12px; color: #555; gap: 4px; }
.filters input[type=date], .filters select, .filters input[type=search] {
  font-size: 14px; padding: 6px 8px; border: 1px solid #CCD; border-radius: 6px; background: #fff; min-width: 0;
}
.filters input[type=search] { flex: 1; min-width: 160px; }
.btn { font-size: 14px; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; }
.btn-primary { background: #1F3A5F; color: #fff; }
.btn-primary:hover { background: #2C507F; }
.btn-secondary { background: #E5EAF1; color: #1F3A5F; }
.btn-secondary:hover { background: #D4DCE7; }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.stats .card { background: #fff; border-radius: 10px; padding: 12px 8px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.stats .label { color: #888; font-size: 11px; margin-bottom: 4px; }
.stats .value { font-size: 20px; font-weight: bold; color: #1F3A5F; }
@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
}
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .hint { color: #888; font-size: 12px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: #1F3A5F; color: #fff; padding: 8px 6px; position: sticky; top: 0;
  text-align: center; font-weight: 600; white-space: nowrap;
}
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { background: #2C507F; }
thead th .sort-arrow { font-size: 10px; margin-left: 3px; opacity: .7; }
tbody td { padding: 7px 6px; border-bottom: 1px solid #EEE; text-align: center; white-space: nowrap; }
tbody tr:nth-child(even) { background: #F9FBFC; }
tbody tr:hover { background: #EEF3F8; }
.dir-long { color: #C62828; font-weight: bold; }
.dir-short { color: #2E7D32; font-weight: bold; }
.ret-pos { color: #C62828; }
.ret-neg { color: #2E7D32; }
.result-correct { color: #2E7D32; font-weight: bold; }
.result-wrong { color: #C62828; font-weight: bold; }
.result-pending { color: #999; }
.empty-msg { padding: 30px; text-align: center; color: #999; }
.capture-header { display: none; padding: 14px 6px 10px; }
@media (max-width: 640px) {
  body { padding: 10px; }
  header h1 { font-size: 18px; }
  .stats { grid-template-columns: 1fr; }
  .stats .value { font-size: 18px; }
  .filters input[type=search] { width: 100%; flex: 1 1 100%; }
  table { font-size: 12px; }
  thead th, tbody td { padding: 6px 4px; }
}
.capturing .capture-header { display: block; }
.capturing .filters, .capturing .toolbar, .capturing .quick-presets { display: none !important; }
.preset-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.preset-label { color: #555; font-size: 12px; margin-right: 4px; }
.btn-mini { padding: 4px 11px; font-size: 12px; border-radius: 999px; background: #E5EAF1; color: #1F3A5F; border: 1px solid transparent; cursor: pointer; }
.btn-mini:hover { background: #D4DCE7; }
.btn-mini.active { background: #1F3A5F; color: #fff; }
.filters input[type=number] { width: 80px; font-size: 14px; padding: 6px 8px; border: 1px solid #CCD; border-radius: 6px; background: #fff; }
.chart-panel .chart-title { font-weight: bold; color: #1F3A5F; font-size: 15px; margin-bottom: 2px; }
.chart-panel .chart-hint { color: #888; font-size: 11px; margin-bottom: 10px; }
.chart-wrap { position: relative; height: 280px; }
.chart-empty { text-align: center; color: #999; padding: 60px 10px; font-size: 13px; }
@media (max-width: 640px) {
  .chart-wrap { height: 220px; }
  .filters input[type=number] { width: 70px; }
}
</style>
</head>

<div class="wrap" id="captureArea">
  <header>
    <h1>📊 回測查詢報表</h1>
    <div class="meta">純技術選股 v2 · 產製於 2026-08-05 08:57 · 共 <span id="totalCount">0</span> 筆紀錄</div>
  </header>

  <div class="capture-header panel">

  <div class="panel quick-presets">

      <button class="btn-mini" data-preset="7">近 7 天</button>

      <button class="btn-mini" data-preset="month">本月</button>
      <button class="btn-mini" data-preset="prevmonth">上月</button>
      <button class="btn-mini" data-preset="all">全部</button>
    </div>
  </div>

  <div class="panel filters">
    <div class="row">
      <label>起始日<input type="date" id="dateStart"></label>
      <label>結束日<input type="date" id="dateEnd"></label>
      <label>方向
        <select id="dirSelect">
          <option value="">全部</option>
          <option value="做多">做多</option>
          <option value="做空">做空</option>
        </select>
      </label>
      <label>結果
        <select id="resultSelect">
          <option value="">全部</option>
          <option value="pending">進行中</option>
          <option value="win">已贏 ✓</option>
          <option value="loss">已輸 ✗</option>
        </select>
      </label>
      <label>出場原因
        <select id="exitReasonSelect">
          <option value="">全部</option>
          <option value="停損">停損</option>
          <option value="目標">目標</option>
          <option value="跳空停損">跳空停損</option>
          <option value="到期">到期</option>
        </select>
      </label>
      <label>評分下限<input type="number" id="scoreMin" placeholder="-100" min="-100" max="100" step="1"></label>
      <label>評分上限<input type="number" id="scoreMax" placeholder="100" min="-100" max="100" step="1"></label>
      <label style="flex:1;min-width:160px;">關鍵字
        <input type="search" id="searchBox" placeholder="代號或公司名...">
      </label>
      <button class="btn btn-secondary" id="resetBtn">重設</button>
    </div>
  </div>

  <div class="stats">
    <div class="card"><div class="label">樣本數（已結算）</div><div class="value" id="statSamples">—</div></div>
    <div class="card"><div class="label">勝率</div><div class="value" id="statWinrate">—</div></div>
    <div class="card"><div class="label">平均報酬（事件結算）</div><div class="value" id="statAvgReturn">—</div></div>
    <div class="card"><div class="label">平均 MAE（最大不利）</div><div class="value" id="statAvgMae">—</div></div>
    <div class="card"><div class="label">跳空認損次數</div><div class="value" id="statGapLoss">—</div></div>
  </div>

  <div class="panel chart-panel">
    <div class="chart-title">📈 累積策略報酬曲線</div>
    <div class="chart-hint">使用「實際報酬%」（事件結算：跳空/觸停損/觸目標/到期），依推薦日累加每日平均報酬</div>
    <div class="chart-wrap"><canvas id="cumChart"></canvas></div>
    <div class="chart-empty" id="chartEmpty" style="display:none;">尚無已結算的紀錄</div>
  </div>

  <div class="panel toolbar">
    <button class="btn btn-primary" id="exportPdfBtn">📥 下載目前畫面 PDF</button>
    <span class="hint">依目前篩選條件產生 PDF</span>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table id="resultTable">
        <thead>
          <tr>
            <th class="sortable" data-key="date">推薦日<span class="sort-arrow"></span></th>
            <th class="sortable" data-key="code">代號<span class="sort-arrow"></span></th>
            <th>公司</th>
            <th>方向</th>
            <th class="sortable" data-key="entry">進場<span class="sort-arrow"></span></th>
            <th>停損</th>
            <th>目標</th>
            <th>出場日</th>
            <th>出場價</th>
            <th class="sortable" data-key="actualRet">報酬%<span class="sort-arrow"></span></th>
            <th>出場原因</th>
            <th class="sortable" data-key="mae">MAE%<span class="sort-arrow"></span></th>
            <th>天</th>
            <th>結果</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
      <div class="empty-msg" id="emptyMsg" style="display:none;">無符合條件的資料</div>
    </div>
  </div>
</div>

const META = {"defaultStart": "2026-07-06", "defaultEnd": "2026-08-05", "totalCount": 153};

const fmtPct = (v) => (v == null || isNaN(v)) ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
const parseFloatOrNull = (s) => { const v = parseFloat(s); return isNaN(v) ? null : v; };

function readFilters() {
  return {
    start: document.getElementById("dateStart").value,
    end: document.getElementById("dateEnd").value,
    direction: document.getElementById("dirSelect").value,
    result: document.getElementById("resultSelect").value,
    exitReason: document.getElementById("exitReasonSelect").value,
    scoreMin: parseFloatOrNull(document.getElementById("scoreMin").value),
    scoreMax: parseFloatOrNull(document.getElementById("scoreMax").value),
    search: document.getElementById("searchBox").value.trim().toLowerCase(),
  };
}

let sortKey = "date";
let sortDir = -1; // -1 desc, 1 asc

function applyFilter() {
  const f = readFilters();
  return RECORDS.filter(r => {
    const d = r.date;
    if (f.start && d < f.start) return false;
    if (f.end && d > f.end) return false;
    if (f.direction && r.direction !== f.direction) return false;

    if (f.result) {
      const settled = r.result === "✓" || r.result === "✗";
      if (f.result === "pending" && settled) return false;
      if (f.result === "win" && r.result !== "✓") return false;
      if (f.result === "loss" && r.result !== "✗") return false;
    }

    if (f.exitReason && r.exitReason !== f.exitReason) return false;

    if (f.scoreMin != null || f.scoreMax != null) {
      const s = parseFloatOrNull(r.score);
      if (s == null) return false;
      if (f.scoreMin != null && s < f.scoreMin) return false;
      if (f.scoreMax != null && s > f.scoreMax) return false;
    }

    if (f.search) {
      const hay = (r.code + " " + r.name).toLowerCase();
      if (!hay.includes(f.search)) return false;
    }
    return true;
  });
}

function sortRows(rows) {
  const k = sortKey;
  return rows.slice().sort((a, b) => {
    let va = a[k], vb = b[k];
    if (k === "ret" || k === "actualRet" || k === "mae" || k === "entry") {
      va = parseFloatOrNull(va); vb = parseFloatOrNull(vb);
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      return (va - vb) * sortDir;
    }
    return String(va).localeCompare(String(vb)) * sortDir;
  });
}

function renderStats(rows) {
  const settled = rows.filter(r => r.result === "✓" || r.result === "✗");
  const correct = settled.filter(r => r.result === "✓").length;
  const total = settled.length;
  const rets = settled.map(r => parseFloatOrNull(r.actualRet)).filter(v => v != null);
  const avg = rets.length ? rets.reduce((a, b) => a + b, 0) / rets.length : null;
  const maes = settled.map(r => parseFloatOrNull(r.mae)).filter(v => v != null);
  const avgMae = maes.length ? maes.reduce((a, b) => a + b, 0) / maes.length : null;
  const gapLoss = settled.filter(r => r.exitReason === "跳空停損").length;

  const fmtPctSigned = (v) => v == null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%";

  document.getElementById("statSamples").textContent = total + " 筆";
  document.getElementById("statWinrate").textContent = total ? (correct / total * 100).toFixed(1) + "%" : "—";
  document.getElementById("statAvgReturn").textContent = fmtPctSigned(avg);
  document.getElementById("statAvgMae").textContent = fmtPctSigned(avgMae);
  document.getElementById("statGapLoss").textContent = gapLoss + " 次";
}

function renderTable(rows) {
  const tbody = document.getElementById("resultBody");
  const empty = document.getElementById("emptyMsg");
  tbody.innerHTML = "";
  if (rows.length === 0) {
    empty.style.display = "block";

  const frag = document.createDocumentFragment();
  for (const r of rows) {

    const ret = parseFloatOrNull(r.actualRet);
    const retCls = ret == null ? "" : (ret >= 0 ? "ret-pos" : "ret-neg");
    const mae = parseFloatOrNull(r.mae);
    const maeCls = mae == null ? "" : (mae < 0 ? "ret-neg" : "");
    const resCls = r.result === "✓" ? "result-correct" : (r.result === "✗" ? "result-wrong" : "result-pending");
    const resTxt = r.result || "—";
    const reasonBadge = r.exitReason ? (r.exitReason === "跳空停損" ? `<span style="color:#C62828;font-weight:bold;">${r.exitReason}</span>` : r.exitReason) : "—";
    tr.innerHTML = `
      <td>${r.date}</td>

      <td class="${retCls}">${r.actualRet ? (parseFloat(r.actualRet) >= 0 ? "+" : "") + parseFloat(r.actualRet).toFixed(2) + "%" : "—"}</td>
      <td>${reasonBadge}</td>
      <td class="${maeCls}">${r.mae ? parseFloat(r.mae).toFixed(2) + "%" : "—"}</td>
      <td>${r.holdingDays || "—"}</td>
      <td class="${resCls}">${resTxt}</td>`;
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
}

function refreshAll() {
  const filtered = applyFilter();
  const sorted = sortRows(filtered);
  renderStats(sorted);
  renderTable(sorted);
  renderChart(filtered);
  updateCaptureMeta(filtered.length);
}

let cumChart = null;
function renderChart(rows) {
  // 用「實際報酬%」（事件結算後已依方向調整：做空時，價跌 = 正報酬）。
  // 若該筆沒有實際報酬%，fallback 到 T+7 報酬%（需手動翻號）。
  const settled = rows
    .filter(r => r.result === "✓" || r.result === "✗")
    .map(r => {
      const actual = parseFloatOrNull(r.actualRet);
      if (actual != null) {
        return { date: r.date, direction: r.direction, stratRet: actual };
      }
      const raw = parseFloatOrNull(r.ret);
      if (raw == null) return null;
      return {
        date: r.date,
        direction: r.direction,
        stratRet: r.direction === "做空" ? -raw : raw,
      };
    })
    .filter(x => x)
    .sort((a, b) => a.date.localeCompare(b.date));

  const empty = document.getElementById("chartEmpty");
  const canvas = document.getElementById("cumChart");
  if (settled.length === 0) {
    if (cumChart) { cumChart.destroy(); cumChart = null; }
    canvas.style.display = "none";
    empty.style.display = "block";
    return;
  }
  canvas.style.display = "block";
  empty.style.display = "none";

  const byDate = {};
  for (const r of settled) {
    if (!byDate[r.date]) byDate[r.date] = [];
    byDate[r.date].push(r);
  }
  const dates = Object.keys(byDate).sort();
  const mean = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;

  let cumAll = 0, cumLong = 0, cumShort = 0;
  const allLine = [], longLine = [], shortLine = [];
  for (const d of dates) {
    const recs = byDate[d];
    const allM = mean(recs.map(r => r.stratRet));
    const longM = mean(recs.filter(r => r.direction === "做多").map(r => r.stratRet));
    const shortM = mean(recs.filter(r => r.direction === "做空").map(r => r.stratRet));
    if (allM != null) cumAll += allM;
    if (longM != null) cumLong += longM;
    if (shortM != null) cumShort += shortM;
    allLine.push(cumAll);
    longLine.push(cumLong);
    shortLine.push(cumShort);
  }

  const data = {
    labels: dates,
    datasets: [
      { label: "整體", data: allLine, borderColor: "#1F3A5F", backgroundColor: "rgba(31,58,95,.08)", tension: 0.2, borderWidth: 2, fill: true, pointRadius: 2 },
      { label: "做多", data: longLine, borderColor: "#C62828", backgroundColor: "rgba(198,40,40,.04)", tension: 0.2, borderWidth: 1.5, fill: false, pointRadius: 2 },
      { label: "做空", data: shortLine, borderColor: "#2E7D32", backgroundColor: "rgba(46,125,50,.04)", tension: 0.2, borderWidth: 1.5, fill: false, pointRadius: 2 },
    ],
  };
  const options = {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { position: "top", labels: { font: { size: 12 }, boxWidth: 14 } },
      tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y >= 0 ? "+" : ""}${ctx.parsed.y.toFixed(2)}%` } },
    },
    scales: {
      x: { ticks: { autoSkip: true, maxTicksLimit: 10, font: { size: 10 } }, grid: { display: false } },
      y: { ticks: { callback: (v) => (v >= 0 ? "+" : "") + v.toFixed(1) + "%", font: { size: 11 } }, grid: { color: "#EEE" } },
    },
  };

  if (cumChart) {
    cumChart.data = data;
    cumChart.options = options;
    cumChart.update();
  } else {
    cumChart = new Chart(canvas.getContext("2d"), { type: "line", data, options });
  }
}

function parseDateStr(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}

function applyPreset(preset) {
  const today = parseDateStr(META.defaultEnd);
  let start = "", end = "";
  if (preset === "all") {
    start = ""; end = "";
  } else if (preset === "7") {
    end = fmtDate(today);
    const s = new Date(today); s.setDate(s.getDate() - 6);
    start = fmtDate(s);
  } else if (preset === "30") {
    end = fmtDate(today);
    const s = new Date(today); s.setDate(s.getDate() - 29);
    start = fmtDate(s);
  } else if (preset === "month") {
    start = fmtDate(new Date(today.getFullYear(), today.getMonth(), 1));
    end = fmtDate(new Date(today.getFullYear(), today.getMonth() + 1, 0));
  } else if (preset === "prevmonth") {
    start = fmtDate(new Date(today.getFullYear(), today.getMonth() - 1, 1));
    end = fmtDate(new Date(today.getFullYear(), today.getMonth(), 0));
  }
  document.getElementById("dateStart").value = start;
  document.getElementById("dateEnd").value = end;
  document.querySelectorAll("[data-preset]").forEach(b => b.classList.toggle("active", b.dataset.preset === preset));
  refreshAll();
}

function updateCaptureMeta(n) {
  const f = readFilters();
  const parts = [];
  if (f.start || f.end) parts.push(`期間 ${f.start || "—"} ~ ${f.end || "—"}`);
  if (f.direction) parts.push(`方向：${f.direction}`);
  if (f.search) parts.push(`關鍵字：${f.search}`);
  parts.push(`共 ${n} 筆`);
  document.getElementById("captureMeta").textContent = parts.join(" · ");
}

document.querySelectorAll("th.sortable").forEach(th => {
  th.addEventListener("click", () => {
    const k = th.dataset.key;
    if (sortKey === k) sortDir = -sortDir;
    else { sortKey = k; sortDir = (k === "date" || k === "ret") ? -1 : 1; }
    document.querySelectorAll("th.sortable .sort-arrow").forEach(a => a.textContent = "");
    th.querySelector(".sort-arrow").textContent = sortDir > 0 ? "▲" : "▼";
    refreshAll();
  });
});

["dateStart","dateEnd","dirSelect","resultSelect","exitReasonSelect","scoreMin","scoreMax","searchBox"].forEach(id => {
  document.getElementById(id).addEventListener("input", refreshAll);
});

// 手動改日期時清除快捷時段的 active 狀態
["dateStart","dateEnd"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    document.querySelectorAll("[data-preset]").forEach(b => b.classList.remove("active"));
  });
});

document.querySelectorAll("[data-preset]").forEach(btn => {
  btn.addEventListener("click", () => applyPreset(btn.dataset.preset));
});

document.getElementById("resetBtn").addEventListener("click", () => {
  document.getElementById("dateStart").value = META.defaultStart;
  document.getElementById("dateEnd").value = META.defaultEnd;
  document.getElementById("dirSelect").value = "";
  document.getElementById("resultSelect").value = "";
  document.getElementById("exitReasonSelect").value = "";
  document.getElementById("scoreMin").value = "";
  document.getElementById("scoreMax").value = "";
  document.getElementById("searchBox").value = "";
  document.querySelectorAll("[data-preset]").forEach(b => b.classList.remove("active"));
  refreshAll();
});

document.getElementById("exportPdfBtn").addEventListener("click", async () => {
  const btn = document.getElementById("exportPdfBtn");
  btn.disabled = true;
  btn.textContent = "產生 PDF 中...";
  document.body.classList.add("capturing");
  try {
    const target = document.getElementById("captureArea");
    const canvas = await html2canvas(target, { scale: 2, backgroundColor: "#F4F6F9", windowWidth: target.scrollWidth });
    const imgData = canvas.toDataURL("image/jpeg", 0.92);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: canvas.width > canvas.height ? "l" : "p", unit: "pt", format: "a4" });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const ratio = Math.min(pageW / canvas.width, pageH / canvas.height);
    const w = canvas.width * ratio, h = canvas.height * ratio;
    pdf.addImage(imgData, "JPEG", (pageW - w) / 2, (pageH - h) / 2, w, h);
    const ts = new Date().toISOString().slice(0, 10);
    pdf.save(`backtest_${ts}.pdf`);
  } catch (e) {
    alert("PDF 產生失敗：" + e.message);
  } finally {
    document.body.classList.remove("capturing");
    btn.disabled = false;
    btn.textContent = "📥 下載目前畫面 PDF";
  }
});

document.getElementById("totalCount").textContent = RECORDS.length;
document.getElementById("dateStart").value = META.defaultStart;
document.getElementById("dateEnd").value = META.defaultEnd;
document.querySelector('th[data-key="date"] .sort-arrow').textContent = "▼";
refreshAll();
</script>
